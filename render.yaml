services:
  - type: web
    name: college-course-registration-system
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/registration.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
